<p><strong>垃圾邮件过滤器</strong><br />
<br />
定义过滤条件以阻止任何不必要的或垃圾邮件进入您的收件箱。符合您定义的条件的邮件将被丢弃，并且不会从中创建任何请求。<br />
配置垃圾邮件过滤器。<br />
<br />
要标记出所有垃圾邮件，请确保您选择规则明确地定义了规则，如果该规则必须匹配所有条件或任何指定条件。<br />
在<strong>定义规则</strong>，从下拉列表中选择条件，然后选择条件。单击<strong>选择</strong>，将逗号分隔的条目添加到过滤条件。比如，&ldquo;主题&rdquo;字段可以包含&ldquo;不在办公室&rdquo;或&ldquo;今天不在&rdquo;。<br />
点击<strong>添加到规则</strong>并<strong>保存</strong>。</p>
