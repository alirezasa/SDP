    <p>通过设置一个代理服务器，确保您的组织与其他服务器之间的连接或互动。</p>
    <p>在配置代理设置时提供以下信息：</p>
    <p><strong>主机：</strong>指定代理服务器的名称（例如：servicedesk-1212）。</p>
    <p><strong>端口：</strong>指定代理服务器的端口号（例如：8080）。</p>
    <p><strong>用户名：</strong>为代理设置指定用户名（例如：servicedesk）。</p>
    <p><strong>密码：</strong>为代理设置指定密码。</p>
    <p>如果代理配置输入不正确，以下功能会受到影响：</p>
    <ul>
        <li>邮件服务器设置（接收/发送）</li>
        <li>Analytics Plus/Zoho Analytics集成</li>
        <li>系统更新</li>
        <li>SMS通知设置</li>
        <li>其他集成</li>
    </ul>
