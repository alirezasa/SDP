<p>在此页面上，您可以添加公司分支机构所在的地理区域。<br />
<br />
单击<strong>新添区域，</strong>然后填写显示的表单。<br />
添加每个区域的负责人，例如区域经理和区域主管。<br />
您也可以在区域主页（列表视图）中编辑或删除已经添加的区域。<br />
<br />
<strong>注意：</strong>上面提到的配置可以仅从ESM目录完成，在个别服务台实例下将不可用。删除区域时，其相关的地点及其属性（例如组，SLA，业务规则和假日）也将被删除。&nbsp;</p>
