<!doctype html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>集成密钥</title>
	</head>
	<body>
		<p><strong>集成密钥</strong></p>
		<p>集成密钥是一个基于令牌的认证方式，用于执行保护REST API调用。</p>
		<p><strong>新建集成密钥：</strong></p>
		<ul class="pl30 ml10">
			<li>点击<strong>+新建</strong>来生成一个新的集成密钥。</li>
			<li>为密钥输入一个唯一名称。</li>
			<li>关联角色来将集成密钥指派到所选角色的用户。</li>
			<li>您也可以从列表视图中选择一个集成密钥，点击重新指派，来选择技术员(仅具有<strong>SDAdmin</strong>角色的用户)。</li>
			<li>点击过期于为密钥选择一个过期日期。</li>
			<li>您也可以选择<strong>从不过期</strong>为密钥设置无期限的有效性。</li>
			<li>点击<strong>生成</strong>来创建一个新的密钥。</li>
		</ul>
		<p><strong>列表视图</strong></p>
		<p>生成的密钥将会列在列表视图中，在这里您可以执行重新指派它们到用户，编辑或删除它们。</p>
	</body>
</html>
