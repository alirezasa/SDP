<p><b>Criticality</b></p>

<p>On this page, you can define the criticalities present in the spaces.&nbsp;</p>

<p>You can add relevant icons to the criticalities which will be shown in space details.</p>

<p>To add a new criticality, click <b>New Criticality</b> and fill out the required details on the displayed page, and click <b>Save</b>.</p>
