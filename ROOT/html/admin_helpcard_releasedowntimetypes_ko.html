<p>서비스 배포 중에 발생할 수 있는 다양한 유형의 다운타임을 추가합니다.</p>
<ul>
   <li>다운타임 유형을 추가하려면 <strong>새로 만들기</strong> 버튼을 사용하십시오.</li>
   <li>다운타임 유형 옆에 있는 <strong>햄버거</strong> 아이콘을 사용하여 다운타임 유형을 수정하거나 삭제합니다. 다운타임 유형을 클릭하여 수정할 수도 있습니다.</li>
</ul>
<p><strong>참고 사항</strong>:</p>
<p> 기본 및 비활성 다운타임 유형을 포함하여 최대 50개의 다운타임 유형이 지원됩니다.</p>
<p>다운타임이 릴리스에서 사용되는 동안 삭제되면 다운타임이 비활성화됩니다. 비활성 다운타임을 편집하여 복원할 수 있습니다.</p>
</body>
