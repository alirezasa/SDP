<p style="margin-top: 0px; margin-bottom: 0px;"><span class="helpheading">購買リクエスト設定</span></p>

<br>
<p style="margin-top: 0pt; margin-bottom: 0pt;">購買リクエストの設定により、サービスリクエスト変更が購買リクエストに変更する際、ユーザーに通知することができます。また、購買リクエストが作成された際に通知する<b>技術担当者</b>も選択できます。</p>
<br>
<p style="margin-top: 0pt; margin-bottom: 0pt;">購買リクエストを技術担当者に通知するには、</p>

<blockquote>
	<p style="margin-top: 0px; margin-bottom: 0px;">1."<b>技術担当者にメール通知を送信</b>"を有効にすると、購買リクエストが作成されると技術担当者に通知されます。</p>
	<p style="margin-top: 0px; margin-bottom: 0px;">2.通知の一覧に追加したい技術担当者をメールアドレスとともに選択します。</p>
</blockquote>
<br>
<p style="margin-top: 0pt; margin-bottom: 0pt;"><strong>メモ</strong> : メールアドレスがない技術担当者名は通知リストには追加できません。</p>
