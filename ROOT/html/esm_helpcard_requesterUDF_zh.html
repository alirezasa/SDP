<p>每次添加新用户时，您必须要收集所有必要的信息。您可以通过使用用户附加字段来实现。<br />
您可以从以下类型的附加字段中进行选择：<br />
<br />
<strong>单行：</strong>具体信息，例如用户的昵称或员工代码。<br />
<strong>多行：</strong>描述性信息，例如通讯地址或对残疾人的特殊要求。<br />
<strong>选择列表：</strong>提供选项供选择。可能是必需的资产类型。<br />
<strong>数字：</strong>任何与数字有关的信息。例如保险号。<br />
<strong>日期/时间：</strong>具体日期，例如加入日期。<br />
<br />
要添加新的用户附加字段，请单击<strong>添加字段</strong>，选择字段类型，提供字段名称和描述，然后单击<strong>保存</strong>。</p>
</body>
