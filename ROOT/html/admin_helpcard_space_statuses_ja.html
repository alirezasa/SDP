<body>
    <span class="helpheading">スペースステータス</span><br>
    
    <p>このページには、様々なスペースのステータスが表示されています。ステータスの簡単な識別のために、ステータスを色分けすることができます。</p>

    <p>デフォルトで、<strong>「Active」、「Inactive」、「Close」、「Under Construction」、「Under Maintenance」</strong>の5つのステータスがあります。</p>

    <p>新規ステータスを追加するには、<strong>［新規］</strong>をクリックして、表示されたページの必要事項を入力し、<strong>［保存］</strong>をクリックします。</p>

</body>

</html>
