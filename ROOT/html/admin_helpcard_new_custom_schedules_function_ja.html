<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//JA">
<html>
	<head>
        <meta http-equiv="content-type" content="text/html" charset="UTF-8">
	</head>
	<body>
		<ul>
			<li>スケジュール関数の名称を入力します。</li>
			<li>説明に、スケジュール関数の使い方や目的を記載します。</li>
			<li>関数を他のカスタム関数からコールするための一意のAPI名を入力します。</li>
			<li>スケジュール関数を構築するには、Delugeスクリプトエディターと呼ばれる、シンプルなドラッグ&ドロップのインターフェースを使用します。</li>
			<li><strong>［保存］</strong>または、<strong>［保存してテスト］</strong>をクリックし、スケジュール関数をテスト実行します。結果は、デバッグに用いられる<strong>情報</strong>ステートメントとともに表示されます。</li>
		</ul>
		
		<p><strong>注意</strong>：<strong>reportObj</strong>が関数の引数として渡されます。また、関数は<strong>Map型</strong>の値を返す必要があります。</p>
	</body>
</html>
