<div class="ui-dialog bcm-notification bcm-notificationbox" id="bcm-notificationbox" style="height: auto; width: 420px;left: 35%;z-index:100; position:fixed;" role="dialog">

		<div class="pb10"> 
			<div class="rt-btns widget-header clearfix">
				<h4 class="fl" id="broadcast_i18n_title"></h4>
				<div class="fr">
					<span title="Close" rel="uitip" id="bcm-msgclose" class="sdp-glyph sdp-glyph-close ml10 icon-xs"></span>

			</div>
			<div class="rt-content pt5" id="broad_cast_notif">
