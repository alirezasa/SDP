<h4>字段和表单规则</h4>

<p>在此页面上，您可以配置字段和表单规则，并将它们与所有或特定模板关联。</p>

<p>定义在以下情况下要执行的动作：</p>

<p>1.表格已加载</p>

<p>2.修改了一个字段</p>

<p>3.提交请求</p>

<p>&nbsp;</p>

<p><em>字段和表单规则在客户端执行。</em></p>

<p><br />
<strong>添加新规则</strong></p>

<p>单击<strong>创建新规则，</strong>然后提供所需的详细信息。</p>

<p>单击<strong>保存</strong>以添加规则。</p>

<p>使用规则旁边的图标可以编辑，删除和启用/禁用它。</p>

<p>单击操作下拉菜单以批量编辑，删除，启用和禁用规则。</p>

<p>&nbsp;</p>

<p><em>要了解有关字段和表单规则的更多信息，<a href="https://help.servicedeskplus.com/configurations/helpdesk/field-form-rules.html" target="_blank" rel="noopener noreferrer">请单击此处。</a></em></p>
