<p style="margin-top: 0px; margin-bottom: 0px;"><span class="helpheading">購買リクエスト　-　追加フィールド</span></p>

<br>
<p style="margin-top: 0pt; margin-bottom: 0pt;">デフォルトで指定しているフィールドとは別に、購買リクエストフォームにフィールドを追加することができます。次のようなフィールドを追加できます；<span style="font-weight: bold;"></span><b>テキスト</b>フィールド、<span style="font-weight: bold;"></span><b>数値</b>フィールド、<span style="font-weight: bold;"></span><b>日付／時間</b>フィールド等。</p>

<p>新規追加フィールドを追加するには、</p>
 
<blockquote>
	<p>1.各タブを選択し、ラベル名と説明を追加します。</p>
	<p>2.テキストフィールドの追加には、フィールドタイプを選択します。 タイプは、<span style="font-weight: bold;">シングルライン</span>、<span style="font-weight: bold;">マルチライン</span>、<span style="font-weight: bold;">ピック</span>(ドロップダウンメニューリスト)です。追加したいフィールドタイプのラジオボタンを選択してください。</p>
</blockquote>

<p>わかりやすい説明として、サンプル値を追加します。</p>

</body>
