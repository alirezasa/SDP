<strong>SDP-KMP集成</strong> :
</p>
<p align="justify">SDP-Key Manager Plus 集成可帮助技术人员识别目标终端中过期的 SSL/TLS 证书、调用证书更新并将新颁发的证书部署到相应的应用程序，而无需离开他们的ServiceDesk Plus控制台。此外，这种集成使 IT 管理员能够持续监控整个网络的 SSL/TLS 加密强度。每当发现弱加密套件等漏洞时，技术人员都会收到告警，使他们能够立即采取补救措施。</p>
<p align="justify"><span style="font-weight: bold;">在SDP中配置KMP设置：</span></p>

<p style="margin-top: 0.5pt; margin-bottom: 0.5pt;"><strong>KMP URL：</strong> 输入KeyManager Plus的URL。</p>

<p style="margin-top: 0.5pt; margin-bottom: 0.5pt;"><strong>认证令牌：</strong>输入从KeyManager Plus生成的<span style="font-weight: bold;">认证令牌</span>。</p><p style="margin-top: 0.5pt; margin-bottom: 0.5pt;">&nbsp;</p>

<p style="margin-top: 0.5pt; margin-bottom: 0.5pt;">点击保存以保存设置。</p>
