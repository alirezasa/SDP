		<p>计划函数允许用户在系统或其他外部应用程序中通过自定义计划操作数据。 您可以编写脚本从查询报告中提取数据并根据获取的数据执行动作。自定义计划函数基于 Zoho 的专有脚本语言 Deluge 构建。</p>
		
		<p>点击 <strong>新建</strong>来创建一个自定义函数。在自定义函数创建完成后，您可以使用它来创建自定义计划。自定义计划中，活动的自定义函数会显示在自定义函数列表中。</p>
		
		<p>您可以使用关键字来检索自定义动作，使用搜索栏旁边的下拉菜单来过滤特定于模块功能的自定义函数。</p>
		
		<p><strong>动作</strong>下拉菜单允许您批量执行删除、禁用和启动自定义动作功能。修改单独的自定义动作，可点击其名称旁的动作图标。 </p>
		
		<p>注意：仅激活的自定义动作可被用在以上的配置中。
		</p>
