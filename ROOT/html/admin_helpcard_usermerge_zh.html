<!doctype html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>User merge</title>
	</head>

	<body>
	<p style="margin-top: 0px; margin-bottom: 0px; font-weight: normal;">
		<span style="font-weight: bold;">合并重复账户</span>
	</p>
	<p style="margin-top: 0px; margin-bottom: 0px; font-weight: normal;">
		在这个页面上，你可以合并不同域里面，<span style="font-weight: bold;">登录名</span>或者<span style="font-weight: bold;">邮箱地址</span>重复的账号。
	</p>
	<p style="margin-top: 0px; margin-bottom: 0px; font-weight: normal;">
		选择标记重复的标准，例如<span style="font-weight: bold;">登录名</span> or <span style="font-weight: bold;">邮箱地址</span>, 输入域名称(两个域/一个域和 没有域标记为<span style="font-weight: bold;">无</span>), 然后点击<span style="font-weight: bold;">应用滤波器</span>。
	</p>
	<p style="margin-top: 0px; margin-bottom: 0px; font-weight: normal;">
		将列出所选域上的重复帐户对。选择要合并的账户，点击<span style="font-weight: bold;">合并用户</span>。
	</p>
	<p style="margin-top: 0px; margin-bottom: 0px; font-weight: normal;">
		选择父域并单击 <span style="font-weight: bold;">合并用户</span>。
	</p>
	<p style="margin-top: 0px; margin-bottom: 0px; font-weight: normal;">
		合并完成后，你可以在通知或者在<span style="font-weight: bold;">组织>>系统日志查看器</span>中查看总结。
	</p>
	<br>
	<p style="font-weight: bold; margin-top: 0.5pt; margin-bottom: 0.5pt;">
		<span style="margin-top: 0.5pt; margin-bottom: 0.5pt; font-weight: bold;">
			注释:
			<ul style="list-style: disc;" type="disc">
				<li class="kadov-p">
					只有在没有其他合并进程正在进行时，才可以启动合并过程。
				</li>
				<li class="kadov-p">
					当合并进程完成时，将通知所有SDA管理员。
				</li>
				<li class="kadov-p">
					当您合并来自不同站点的用户时，用户资产的站点关联将保持不变。
				</li>
			</ul>
		</span>
	</p>
	</body>
</html>
