<html>
	<head>
		<title>Manage Engine</title>
		<style>
		*{
			margin: 0;
			padding: 0;
			font-family: arial,sans-serif;
		}
		html, body{
			height: 100%;
		}
		.error-page{
			background-color:#b7b7b7;
			margin:0 auto;
			padding:0;
			font-family: arial,sans-serif;
		}
		.table-wrap{
			display: table;
			width: 100%;
			height:100%;
		}
		.table-cell-wrap{
			display: table-cell;
			vertical-align: middle;
		}
		.error-content{
			background-color: #FFF;
			display: table;
			margin: 0 auto;
			border: 1px solid #B9B9B9;
			box-shadow: 0px 0px 15px 0px #8E8E8E;
		}
		.error-text{
			padding-bottom: 20px;
		}
		.error-text{
			width: 472px;
			float: left;
		}
		.error-text .error-request{
			font-size: 31px;
			padding: 0px 0px 0px 26px;
			color: #E13B0E;
			font-weight: bold;
		}
		.error-text ul{
			padding: 24px 0px 0px 40px;
			line-height: 21px;
			color: #626262;
			font-size: 14px;
			list-style-type: none;
		}
		.error-errorname{
			padding: 29px 0px 0px 26px;
			font-size: 57px;
			color: #e7623e;
			font-family: -webkit-body;
		}
		.error-list li:before {
			content: '';
			position: absolute;
			width: 7px;
			height: 7px;
			background-color: #E13B0E;
			border-radius: 24px;
			margin-left: -15px;
			margin-top: 7px;
		}
		</style>
	</head>
	<body class="error-page bodybg">
		<div class="table-wrap">
			<div class="table-cell-wrap">
				<div class="error-content">
					<div class="error-text">
						<p class="error-errorname">404</p>
						<p class="error-request">Unfortunately the page you requested does not exist.</p>
						<ul class="error-list">
							<li>You made a mistake when typing the page address (URL).</li>
							<li>Clicked on a broken or incorrect link.</li>
							<li>The requested page has been deleted.</li>
						</ul>
					</div>
				</div>
			</div>
		</div>
	</body>
</html>
