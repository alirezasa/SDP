<p style="font-weight: bold;">垃圾邮件过滤设置</p>
<p>垃圾邮件过滤可以避免将不需要的垃圾邮件转换为请求。这里的垃圾邮件指的是不想将其记录在帮助台中的邮件（有别与常规意义的垃圾邮件的定义），比如：您的帮助台主要服务于内部用户，则可以将所有来自其它外部域（自己公司的域名以外的域）都可以视为垃圾邮件，不将其转换为请求记录。这样设置之后，来自外部域的邮件将不会创建新的请求。<br>
  <br>
  在这里，您可以定义垃圾邮件的过滤条件。<br>
  <br>
比如:&nbsp;如果您创建一个规则，其内容为：'发件人不包含 @manageengine.com '，这样，只有来自@manageengine.com域名的邮件才会被创建请求。<br>
  <br>
点击<strong>保存</strong>按钮，使设置生效。<br><!--}}end!kadov--><!--kadov_tag{{<implicit_p>}}--></p>
