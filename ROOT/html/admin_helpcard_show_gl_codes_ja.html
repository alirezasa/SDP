<p>購買注文書を作成する際に、総勘定元帳勘定コード（GLコード）を関連付けることができます。総勘定元帳には、組織内に発生する全取引に特定のコードを割り振ります。購買にGLコードを設定することで、特定の取引に関する情報を追跡することが可能になります。 </p>
<p>あらたにGLコードを追加するには、<b>GLコード一覧表</b>の右上にある<b>新規GLコード</b>をクリックします。<br><br><span class="helpheading">GLコード情報</span><br>フォームに<strong>GLコード</strong>と<strong>説明</strong>を入力します。<br><br><b>GLコード：</b>GLコードを入力します（入力必須フィールド）。<br><strong>説明：</strong>GLコードについての説明を入力します。<br><br><b>GLコードの追加</b>ボタンをクリックして、情報を保存します。<br>
</p>
</body></html>
