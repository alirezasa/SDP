<p style="margin-top: 0px; margin-bottom: 0px;"><span class="helpheading">
采购请求的设置</span></p>

<br>
<p style="margin-top: 0pt; margin-bottom: 0pt;">
通过本页面可以设置采购请求的通知机制，允许在服务请求变更为采购请求时通知用户，同时也可以提交采购请求时选择要通知的技术员。</p>
<br>
<p style="margin-top: 0pt; margin-bottom: 0pt;">要通知采购请求的技术员，</p>

<blockquote>
	<p style="margin-top: 0px; margin-bottom: 0px;">1. 选中“<b>发送邮件通知给技术员</b>”的选项，</p>
	<p style="margin-top: 0px; margin-bottom: 0px;">2 
	.将要通知的技术员（设置有正确的邮箱）添加到通知列表中</p>
	<p style="margin-top: 0px; margin-bottom: 0px;">&nbsp;</p>
	<p style="margin-top: 0px; margin-bottom: 0px;">这样，当采购请求被创建时，将通知指定的技术员。</p>
</blockquote>
<br>
<p style="margin-top: 0pt; margin-bottom: 0pt;"><strong>注意</strong>: 
没有设置邮箱的技术员，不能添加到通知列表中。</p>
