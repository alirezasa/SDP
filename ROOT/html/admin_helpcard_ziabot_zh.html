	<title>Zia机器人</title>

<body>
<p>
	Zia机器人帮助用户执行20种不同的操作，包括提交工单、为请求分配技术人员、访问服务目录、提出服务请求，以及查看解决方案/公告等，只需输入命令或通过聊天框询问Zia。
</p>
<p>
	在这个页面上，您可以启用或禁用Zia机器人，并查看可以通过机器人执行的预定义操作，以及它们的工作流。您还可以看到激活这些操作的命令。一旦启用，Zia机器人图标将显示在用户的右下角栏，并将显示仅根据用户的范围的行动。在<b>历史</b>页签下，您可以查看Zia机器人的激活和反激活记录。
</p>
</body>
