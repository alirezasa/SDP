<body>
	<p>표시된 페이지에서 사용자 정의 액션의 이름과 설명을 입력합니다.</p>
	<p><strong>Deluge Script Editor</strong>라고 하는 간단한 드래그 앤 드롭 인터페이스를 사용하여 사용자 정의 액션을 빌드합니다. <strong>projectObj</strong> 및 <strong>context</strong>는 함수에 인수로 전달됩니다. 함수는 <strong>Map</strong> 유형의 데이터를 반환해야 합니다. 자세한 내용은 <a href="https://help.servicedeskplus.com/project-custom-function" target="_blank">이 페이지를 방문하십시오.</a></p>
	<p><strong>저장하고 테스트</strong>를 클릭하여 프로젝트에서 사용자 정의 액션을 테스트 실행합니다. 출력은 디버깅에 사용되는 <strong>info</strong> 문과 함께 인쇄됩니다. 사용자 정의 액션을 간단히 저장할 수도 있습니다.</p>
</body>
