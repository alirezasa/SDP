<head>
</head>
<body>
<p><strong>对于工作日志，除了预设的字段外，也允许您定义自己的附加字段。</strong></p>
<ul>
    <li>您可以添加单行、精选列表、多行、数值、日期/时间和小数字段。</li>
    <li>单行、精选列表和多行字段可用于收集文本信息，而数值、日期/时间和小数字段则可用于收集与数字有关的信息。</li>
    <li>如要在单行字段下收集数字信息，请选择<strong>只允许数值</strong>选项。</li>
    <li>如果您想为这些字段添加一些默认值，您可以在文本框中输入需要的默认值。</li>
    <li>在每个字段下，当您在左边输入信息时，该字段的预览将在右边显示。</li>
</ul>
</body>
</html>
