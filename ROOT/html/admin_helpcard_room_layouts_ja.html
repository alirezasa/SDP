<body>
    <p class="helpheading"><b>ルームレイアウト</b></p>

    <p>このページでは、部屋のテーブルや椅子の配置などの様々なレイアウトを表示します。<br />
    <br />
    部屋を追加する際のレイアウトごとに、様々なキャパシティを設定することができます。<br />
    <br />
    デフォルトとして、<b>「Boardroom」、「Classroom」、「Theatre」、「U-Shaped」</b>といった4つのルームレイアウトが用意されています。<br />
    <br />
    新規ルームレイアウトを作成するには、<b>［新規］</b>をクリックし、表示されたページで必要事項を入力した後、<b>［保存］</b>をクリックします。</p>

</body>

</html>
