<p class=helpheading
	style="margin-top: 0px; margin-bottom: 0px;">协议的附加字段</p>

<p style="margin-top: 0pt; margin-bottom: 0pt;">&nbsp;</p>

<p style="margin-top: 0px; margin-bottom: 0px;">如果您在添加许可协议时除了预定义字段外还需要添加更多字段，您可以在协议的附加字段中进行设置。您可以在表单中添加<span style="font-weight: bold;">文本</span>字段<span style="font-weight: bold;">、数值</span>字段<span style="font-weight: bold;">、日期/时间</span>字段和<span 
 style="font-weight: bold;">成本</span>字段。选择每一个标签并为显示在许可协议表单中的字段添加标签名称和描述。<br>
<br>当您添加文本字段时，有一个选项供您选择所需文本字段的类型。文本字段可以是<span style="font-weight: bold;">单行</span>文本字段，<span style="font-weight: bold;">多行</span>文本框，和精选列表。选择单行单选按钮，多行单选按钮或精选列表。</p>

<p style="margin-top: 0px; margin-bottom: 0px;">&nbsp;</p>

<p style="margin-top: 0px; margin-bottom: 0px;">当您添加成本字段时，
选择适当的单选按钮，您既可以添加正成本字段也可以添加负成本字段。<br>
<br>
您也可以在给出的文本框中为这些字段指定默认值。 <span style="margin-top: 0px; margin-bottom: 0px;"><br>
<br>
点击<b>保存</b>对设置进行保存。</span></p>
