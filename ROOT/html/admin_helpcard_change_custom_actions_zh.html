<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
<meta charset="UTF-8">
<title>自定义动作</title>
</head>

	<body>
		<p>自定义动作是可操作的自定义函数，允许用户在ServiceDesk Plus和其他外部应用程序中操作数据。 自定义函数基于Zoho的专有脚本语言Deluge构建。</p>
		<p>自定义动作可用于变更自定义触发器，对变更、其他模块和外部程序执行动作。</p>
		<p>使用<strong>新建</strong>按钮创建一个自定义动作。</p>
		<p><strong>动作</strong>按钮可以批量删除、禁用和启用自定义动作。要修改个人自定义动作，使用自定义动作旁边的图标。请注意只有活动的自定义动作可用于变更自定义触发器。</p>
		<p>使用关键词在所提供的字段中搜索自定义动作。使用顶部的过滤器显示不同功能中使用的自定义动作。</p>
	</body>
</html>
