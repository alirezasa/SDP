<h4><strong>定界符</strong><br /></h4>
<p>要按模块区分和过滤通知，可以配置定界符。例如，RE作为请求模块，PO作为采购模块。在ServiceDesk Plus中，基于模块的定界符如下：
</p>

<table border="1" cellpadding="10">
	<tbody>
		<tr>
			<td>RE&mdash;&mdash;请求</td>
			<td>TA&mdash;&mdash;任务</td>
			<td>SO&mdash;&mdash;解决方案</td>
		</tr>
		<tr>
			<td>PO&mdash;&mdash;采购订单</td>
			<td>PR&mdash;&mdash;采购请求</td>
			<td>CO&mdash;&mdash;合同</td>
		</tr>
		<tr>
			<td>CH&mdash;&mdash;变更</td>
			<td>PB&mdash;&mdash;问题</td>
			<td>PJ&mdash;&mdash;项目</td>
		</tr>
	</tbody>
</table>

<br />
电子邮件请求将被添加为新请求或对话。若要将电子邮件添加为对话，在通知的主题行中，定界符的&ldquo;请求ID&rdquo;和&ldquo;父ID&rdquo;必须相同。<br />
默认的基本定界符是##，可以根据用户要求进行修改。请注意，基本定界符允许使用的特殊字符为！，@，＃，$，％，^，＆。并且，最大字符数限制为10。
</body>
