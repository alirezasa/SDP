<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>浏览器标题设置</title>
</head>

<body>


<p class="helpheading"><strong>浏览器标题</strong>


<p><strong>自定义浏览器标题</strong>

<p><strong>默认标题：</strong>选择此选项，应用程序中的所有页面，不论是什么模块，都可以使用ManageEngine ServiceDesk Plus的标题。
<strong>所选模块名称：</strong>选择此选项可以自定义浏览器的标题，以匹配当前页面的所选模块名称。</p>

<p><strong>详细信息页面：</strong>您可以单独配置详情页的标题。为此，请点击相应的复选框并输入自定义标题。使用美元符号添加变量以获得动态的自定义标题。例如，如果您想让请求详情页的浏览器标题显示请求ID和主题，请在文本框中输入#$id, $subject。</p>

<strong>注：</strong>
<ul>
	<li>点击 "重置"以恢复默认值。</li>
	<li>自定义详细信息页面标题也将适用于编辑表格。</li>
</ul>


</body>
</html>
