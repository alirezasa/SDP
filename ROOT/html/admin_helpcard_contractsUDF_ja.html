	<p class="helpheading" style="margin-top: 0px; margin-bottom: 0px;">契約追加フィールド</p>

    <p style="margin-top: 0pt; margin-bottom: 0pt;">&nbsp;</p>

<p style="margin-top: 0px; margin-bottom: 0px;"><strong>新規契約入力フォーム</strong>に必要な組織固有のフィールドを追加することができます。追加可能なフィールドタイプは、<strong>テキスト</strong>、<strong>数値</strong>、<strong>日付/時間</strong>の３タイプです。それぞれのタブを選択して追加するフィールドの名称とその説明を入力してください。<br>
<br>
テキストフィールドを選択した場合、<strong>シングルライン</strong>（１行）、<strong>マルチライン</strong>（複数行）、<strong>ピックリスト</strong>（選択式）を選択できます。<br>
<br>
また、入力フォームにあらかじめ表示する<strong>デフォルト値</strong>の設定も可能です。<br>
<br>
最後に設定を<strong>保存</strong>します。</p>
