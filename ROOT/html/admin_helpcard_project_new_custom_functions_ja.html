<title>admin_helpcard_project_new_custom_functions</title>
</head>

<body>
    <p>この画面では、カスタムアクションの関数名、説明、API名を入力してください。</p>
	<p>カスタムアクションを構築するには、Delugeスクリプトエディターと呼ばれる、シンプルなドラッグ&ドロップのインターフェースを使用します。projectObjとcontextが関数の引数として渡されます。また、関数はMap型の値を返す必要があります。</p>
	<p><strong>［保存してテスト］</strong>をクリックすることで、プロジェクトのカスタムアクションのテスト実行を行います。関数の出力は、デバッグに用いられる情報ステートメントとともに表示されます。また、カスタムアクションをテストせず、単に保存することも可能です。</p>
</body>

</html>
