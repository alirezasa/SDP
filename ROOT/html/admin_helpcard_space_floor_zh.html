<p><b>楼层模板</b></p>

<p>为经常创建的楼层创建和保存模板，如办公室、食堂等，以帮助用户创建类似的楼层。</p>

<p>在这个页面，您可以创建一个新的楼层模板，编辑或删除现有的模板。</p>

<p>要创建一个新的楼层模板，点击<b>新建楼层模板</b>。</p>

<p>新的楼层模板有两个分段，</p>

<p>1. <b>信息</b>:在这里，您可以通过添加显示名称、名称和对它的描述来定义楼层模板。</p>

<p>2. <b>字段</b>:一旦保存了信息部分，您可以从右侧的<b>新字段</b>中拖动所需字段，向楼层模板添加新字段。</p>

<p>要命名一个分段，请点击&nbsp;<b>未命名</b>文本，并键入所需的分段名称。</p>

<p>最后，保存字段配置。</p>
