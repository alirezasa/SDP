<div id="help">
<p><span class="helpheading">分布式资产扫描</span></p>
<p class=Numbered style="margin-top: 9.5pt; margin-bottom: 9.5pt;">
AssetExplorer帮助您跨过多个站点扫描分布式资产。在您想要进行资产扫描的远程站点安装AssetExplorer，当扫描完成，从站点中的远程AE服务器导入日志并手动或自动把它导入到您的中央服务器。</p>

 <p class=Numbered
	style="margin-top: 9.5pt; margin-bottom: 9.5pt;"><span style="margin-top: 5pt; margin-bottom: 5pt;">
	被放到在中央服务器的日志会详细地列出日志从哪里导入，接受时间，导入时间等等。</p><br>
<strong>工作流程：</strong> <br><br>
1. 从远程AssetExplorer服务器导出工作站信息（zip格式的文件）。<br>
2. 将生成的信息导入到系统中央服务器。</p>
