	<body>
		<p>回调自定义函数允许您从外部应用程序访问或操作 ServiceDesk Plus 中的数据。 您可以使用 Deluge 脚本语言构建回调自定义函数。</p>
        <ul>
            <li>创建新的回调自定义函数，点击 <strong>新建</strong>。</li>
            <li>编辑一个回调函数，点击函数名称。</li>
            <li>删除回调函数，选择函数并点击<strong>删除</strong>。</li>
        </ul>
		<p>您还可以在方法的动作菜单中，选择相关的动作来编辑或删除一个单独的回调函数。</p>
		<p><strong>提示：</strong>页面也支持通过关键字来检索函数、显示每页显示的函数数量。</p>
	</body>
</html>
