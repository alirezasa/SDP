<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
	<head>
	</head>
	<body>
		<p>在这个页面，您可以构建或编辑一个回调自定义函数。</p>
        <p>构建一个函数： </p>
        <ol>
            <li>提供需要的信息，命名函数名称，返回类型，描述和API名称。</li>
            <li>为函数设置参数以使用外部应用程序的输入。</li>
            <li>使用Deluge编辑器来构建您的函数。</li>
            <li>点击<strong>保存</strong>。</li>
        </ol>
        <p>注意：</p>
        <ul>
            <li>您最多可以设置10个参数。</li>
            <li>API名称必需是唯一的。</li>
            <li>执行函数的URL是根据提供的API名称自动生成的。</li>
            <li>确保选择了发布以使外部程序可以使用它们的URL来执行函数。</li>
        </ul>
		<p>参考<a href="https://help.servicedeskplus.com/callback-functions" target="_blank" class="text-link">此文档</a>来了解更多关于回调自定义函数的内容。</p>
	</body>
</html>
