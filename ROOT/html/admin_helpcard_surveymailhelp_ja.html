    <strong>調査のメール設定</strong><br>
    調査リンクをユーザーに送るためのメールを設定します。リクエスト別調査と一般調査でそれぞれ異なるメールを設定することが可能です。<br>
    メールには様々な言語を用いることができます。</p>
    <ul>
      <li><strong>［新規翻訳］</strong>をクリックして、「言語を選択」のドロップダウンから特定の言語を選択します。</li>
      <li>デフォルトのメールに相当する内容を入力し、<strong>［保存］</strong>をクリックします。</li>
      <li><strong>［アップデート］</strong>をクリックしメール内容を保存します。</li>
    </ul>
    </body>
