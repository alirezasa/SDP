<body>
<p>服务的发布管理过程分为9个连续的阶段。每个阶段的状态表明了发布的进展。除了自定义默认阶段和状态，您还可以添加自定义状态。</p>
<p>点击一个阶段的名称或旁边的下拉图标。将展开阶段的详细信息页面，在这里您可以自定义默认状态，并在阶段下添加新状态。</p>
<ul>
  <li>使用<strong>新建发布状态</strong>按钮在发布中增加状态。您可以提及状态详细信息，并配置角色以在发布到达状态时得到通知。</li>
  <li>要编辑状态, 点击状态或使用在<strong>动作列表</strong>图标下的<strong>编辑</strong>按钮。</li>
  <li>使用<strong>动作列表</strong>图标来删除状态。然而，您不能删除某些默认状态。</li>
</ul>
<p><strong>注：</strong></p>
<p>如果在发布中使用时删除了发布状态，则该状态将被禁用。您可以通过编辑恢复非活动状态。</p>
</body>
</html>
