<p style="margin-top: 0px; margin-bottom: 0px;"><span class="helpheading">구매 요청서 - 추가 필드</span></p>

<br>
<p style="margin-top: 0pt; margin-bottom: 0pt;">구매 요청서 추가 필드를 사용하여 기본적으로 설정된 필드와 별도로 구매 요청서 양식에 기업에서 필요로 하는 특정 필드를 추가합니다. <span style="font-weight: bold;">텍스트</span><필드, <span style="font-weight: bold;">숫자</span>필드 그리고 <span style="font-weight: bold;">날짜/시간</span> 필드를 추가할 수 있습니다.</p>

<p>새 필드를 추가하려면</p>

<blockquote>
<p>1. 새 탭을 선택하고 레이블 이름과 설명을 추가합니다.</p>
<p>2. <span style="font-weight: bold;">한 줄</span>, <span style="font-weight: bold;">여러 줄</span>과 같은 텍스트 필드 유형을 선택하거나 해당 버튼을 클릭하여 <span style="font-weight: bold;">목록</span>(드롭다운 메뉴 목록)을 선택하십시오.</p>
</blockquote>

<p>더 명확성을 위해 샘플 값을 추가합니다.</p>
