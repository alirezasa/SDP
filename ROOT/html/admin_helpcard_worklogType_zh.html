<p>在此页面，您可以记录不同模式技术人员的工作投入，如旅行、现场访问、远程支持、加班支持、周末支持等，并计算出相应的费用。</p>
<p>当在请求模块中，为请求添加工作日志时，需要指定工作日志的类型。这种工作日志的类型，可以在这里进行配置。</p>

<span class="helpheading">添加工作日志类型</span><br>
<p>要添加工作日志类型，点击<strong>新建</strong>。</p>
<p><strong>名称：</strong>为工作日志类型指定一个独特的名称。</p>
<p><strong>颜色：</strong>使用调色板选择一种颜色来表示工作日志类型。</p>
<p><strong>描述：</strong>提供一个关于工作日志类型的简短描述。</p>
<p>点击<strong>保存</strong>或<strong>保存并新添</strong>。</p>
