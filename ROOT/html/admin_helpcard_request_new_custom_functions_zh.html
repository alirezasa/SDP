<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
<meta charset="UTF-8">
<title>自定义函数</title>
</head>

	<body>
		<p>在显示的页面上, 提供自定义动作的名称和描述。</p>
		<p>使用名为<strong>Deluge脚本编辑器</strong>的简单拖拽界面来构建自定义动作。<strong>changeObj</strong>和<strong>context</strong>将被作为函数自变量进行传递。该函数应返回<strong>Map</strong>类型的数据。更多信息，<a href="https://help.servicedeskplus.com/request-custom-function" target="_blank" class="text-link">请单击此处</a>。</p>
		<p>单击<strong>保存并测试</strong>在请求中测试该自定义动作。输出将与用于调试的 <strong>信息</strong> 语句一起打印。您也可以简单地保存自定义动作。</p>
	</body>
</html>
