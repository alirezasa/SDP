<p style="margin-top: 0px; margin-bottom: 0px;"><span class="helpheading">
采购请求的附加字段</span></p>

<br>



	<p>该画面可以根据自己组织机构的情况定义新建采购请求时所需的特定附加信息。它们将出现在新建采购请求的表单中。在这里可以添加<b>文本</b>字段、<b>数值</b>字段、<b>日期</b>类型。</p>
	<p>选择每个页签，添加各个字段的标签名及其描述。这样在新建采购请求时，除了缺省的预定义信息外，还会显示这些附加的字段。 </p>
	<p>添加文本字段时，可以选择所要添加的文本字段的选项，它们是：单行、多行、下拉列表。请选择对应的单选按钮。</p>
	<p>也可以在此画面输入对应的文本、成本字段的缺省值。<br>
	<br>
	设定完成后，点击<b>保存</b>连接保存这些设定。&nbsp;
