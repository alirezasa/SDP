<p style="font-weight: bold;">이전 상태 변경</p>



<p><strong>이전 상태 변경</strong>은 SDP 9.0 이전에 구성된 상태에 해당합니다.</p>
<p> 새로운 변경 작업 흐름 기능의 이점을 제공하기 위해 변경 모듈 전체에서 이전 상태 값이 유효하지 않게 설정됩니다. 따라서 변경 관리자는 새로운 <a href="/SetUpWizard.do?forwardTo=stageandstatus" style="color:blue;text-decoration:underline;">단계/상태 구성 </a>마법사를 통해 동등한 사용자 정의 상태를 정의해야 합니다.
또한 <a href="/SetUpWizard.do?forwardTo=migratestatus" style="color:blue;text-decoration:underline;">새 상태로 마이그레이션</a> 마법사를 사용하여 이전 상태에서 모든 변경 요청을 주어진 새로운 스테이지와 상태 상태로 마이그레이션할 수 있습니다.
