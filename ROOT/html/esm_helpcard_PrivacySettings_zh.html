<p>隐私法规法则（例如通用数据保护法规）要求企业保护其用户的个人数据免遭滥用。GDPR保护所有类型的个人数据，包括用户名，社会保险号，保险详细信息或种族或族裔数据。<br />
通过ServiceDesk Plus可以完全删除或匿名化所有个人身份信息（PII）。<br />
<br />
在此页面上，您只能启用单个服务台实例中的PII选项。<strong>单个服务台实例下的&ldquo;事件附加字段&rdquo;，&ldquo;服务目录&rdquo;和&ldquo;资源问题&rdquo;</strong>提供标识PII的选项<strong>。</strong></p>
