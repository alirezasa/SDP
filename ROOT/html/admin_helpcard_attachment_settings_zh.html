<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>附件设置</title>
</head>

<body>
<p><strong>附件设置</strong></p>
<ul>
  
  <li><strong>最大附件大小 ( MB )</strong>：设置一个允许的附件最大大小，默认为 10 MB。</li>
  <li><strong>配置一个路径来保存附件</strong>：指定一个路径来保存附件，您可以点击重置选项来重置路径。<br>
      <strong>注意：</strong>
      <ol>
          <li>如果没有指定任何路径，默认的路径位置将会用来保存附件。</li>
          <li>位于主目录&lt;SERVICEDESK HOME&gt; 下的文件夹不可配置为附件的存储路径。</li>
          <li>在附件路径中，不得使用 ".." 表示路径。</li>
      </ol>
      <br>
  </li>
   <li>
  	<strong>文件附件过滤</strong>：配置您所允许的文件附件类型，在<strong>包含</strong>或<strong>排除</strong>部分选择文件类型的扩展名。如果您允许所有文件，选择<strong>所有文件</strong>。
  </li>
  
</ul>
</body>
</html>
