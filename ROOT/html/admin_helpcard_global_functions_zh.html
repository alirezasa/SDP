	<body>
		<p>自定义函数允许用户在系统或其他外部应用程序中操作数据。自定义函数基于Zoho的专有脚本语言Deluge构建。</p>
		<p>全局函数可以在自动化动作通过其它的自定义函数调用。它们可以存储连接外部应用程序、常用功能和配置所必需的信息。</p>
		<p>使用 <strong>新建</strong> 创建全局函数，<strong>删除</strong>来删除全局函数。要编辑或者删除某个全局函数，请使用自定义函数旁边的菜单图标。</p> 
		<p>使用关键字在提供的字段中搜索全局函数。</p>
