<p><b>设施服务模板</b></p>

<p>将经常使用的设施服务创建为服务模板，如用车服务、ATM服务等，帮助用户快速创建类似的设施服务。</p>

<p>在这个页面，您可以创建新的设施服务模板，编辑或删除现有的。</p>

<p>创建新的设施服务模板，点击<b>新建设施服务模板</b>。</p>

<p>新的设施服务模板有两个部分：</p>

<p>1. <b>明细</b>: 在这里，您可以添加显示名和描述，以定义设施服务模板的用途。</p>

<p>2. <b>字段</b>: 在您保存了明细内容后，您可以在设施服务模板上添加新的字段，从右侧<b>新建字段</b>部分拖放字段到模板上。</p>

<p>命名一个分段，可点击<b>Untitled</b>文本，输入需要的分段名称。</p>

<p>最后，保存字段配置。</p>
