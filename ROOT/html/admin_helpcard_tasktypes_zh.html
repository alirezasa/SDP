<p>任务类型用于对相似的任务进行分类，以便在创建任务（包括请求、问题、变更及项目下的特定任务）时对任务进行归类管理，从而使管理更加细致、科学。 
例如：不同的排错任务，可以归类为“故障排错”<br>
  <br>
  <span class="helpheading">添加任务类型</span><br>
 在添加任务类型的画面中，有3个字段，它们是：名称、描述以及颜色。<br>
  <br>
<b>名称: </b>任务类型的识别符，请指定唯一的名称，不能重复。 <br>
<strong>描述:</strong> 输入该任务类型的简要描述。
<br>
<strong>颜色:</strong> 为该任务类型选择颜色，可从颜色画板中选择颜色或者直接指定颜色代码。</p>
<p>  点击<b>保存</b>按钮，保存该任务类型，并返回类型列表视图。<br>
  点击<b>保存并新建</b>按钮，可保存该类型并创建新的类型。

</p>
