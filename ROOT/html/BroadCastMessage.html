<div id="BROADCAST_DIALOG_LAYER">
    <div class="p15">
      <div class="mt-5">
        <strong><span class="mandatory">*</span><span id="i18n-broadcast-message-label"></span></strong>
        <textarea rows="5" id="bcm-textarea" autofocus="" class="fw form-control mt3 resize-disabled" maxlength=10000 aria-required="true"></textarea>
        <span id="i18n-broadcast-message-empty-error" class="text-danger alert alert-danger alert-arrow p5" style="position: absolute; z-index: 1; top: 180px; display: none; width: auto; left: auto; white-space: nowrap;"></span>
</div>
<div class="mt15 ml1">
	
	<input type="hidden" name="textval"  id="site_selection" class="w-390px">
</div>
<div class="mt15 ml1">
	
	<input type="hidden" style="width:390px;" name="textval" id="group_selection">
</div>
      <div class="mt15 ml1">
        <label class="radio-inline bcm-label"><input name="broadcast_to" value="all_technicians" checked type="radio"><span id="i18n-broadcast-all-technicians"></span></label>
      </div>
      <div class="mt3 mb5 ml1">
        <label class="radio-inline bcm-label"><input name="broadcast_to" value="logged_in_technicians" type="radio"><span id="i18n-broadcast-loggedin-technicians"></span></label>
      </div>
    </div>
  <div class="form-footer">
      <button type="button" class="btn btn-primary" id="i18n-broadcast-send" data-name="sendBrodCastMessg"></button>
      <button type="button" class="btn btn-default" id="i18n-broadcast-cancel" data-name="closeBroadcastDialog"></button>
  </div>
</div>
