<p style="font-weight: normal;">
对于经常提交的、重复的、解决方法相同的请求，可以创建解决方法模板以便快速解决问题。例如：如何配置打印机，就可以制作成解决方法模板。有了模板，技术人员无需再次重复输入解决办法。<br>
<span style="font-weight: normal;"><br>
要添加一个新的解决方法模板，请在解决方法模板页面点击</span><span style="font-weight: bold;">新添</span><span 
 style="font-weight: normal;">按钮。</span></p>
<span class=helpheading>添加新的解决方法模板</span> 

<p style="font-weight: normal;">要添加新的解决方法模板，可</p>

<p style="margin-top: 5pt; margin-bottom: 5pt;">指定解决方法模板一个唯一<span 
 style="font-weight: bold;">模板名称</span>。例如：打印机配置解决方案。 </p>

<p style="margin-top: 5pt; margin-bottom: 5pt;">在<span style="font-weight: bold;">描述</span>文本框中对模板进行描述。模板名称和描述内容是必须有的。 </p>

<p style="margin-top: 5pt; margin-bottom: 5pt;">
<span style="font-weight: normal;">可以选中</span><span style="font-weight: bold;">将该模板标记为停用</span><span style="font-weight: normal;">复选框暂停使用该模板。 </span></p>

<p style="font-weight: normal;">点击<span style="font-weight: bold;">保存</span>按钮保存该模板，进入解决方法模板列表页面。 <br>
点击<span style="font-weight: bold;">保存并新建</span>按钮保存该模板，然后可继续创建另一个新建模板。</p>
