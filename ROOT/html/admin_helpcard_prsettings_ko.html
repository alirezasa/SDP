<p style="margin-top: 0px; margin-bottom: 0px;"><span class="helpheading">구매 요구서 설정</span></p>

<br>
<p style="margin-top: 0pt; margin-bottom: 0pt;">구매 요청서 설정을 사용하면 서비스 요청이 구매 요청으로 변경될 때 사용자에게 알릴 수 있습니다. 또한 구매 요청이 제기된 경우 알림을 받을 <strong>기술자</strong>를 선택할 수 있습니다.</p>
<br>
<p style="margin-top: 0pt; margin-bottom: 0pt;">기술자에게 구매 요청을 알리려면</p>

<blockquote>
	<p style="margin-top: 0px; margin-bottom: 0px;">1. 구매 요청이 생성될 때 기술자에게 알리려면 "<strong>기술자에게 이메일 알림 보내기...</strong>"를 활성화합니다.</p>
	<p style="margin-top: 0px; margin-bottom: 0px;">2 .알림 목록에 추가할 이메일 ID가 있는 기술자의 이름을 선택합니다.</p>
</blockquote>
<br>
<p style="margin-top: 0pt; margin-bottom: 0pt;"><strong>참고</strong> : 이메일 ID가 없는 기술자 이름은 알림 목록에 추가할 수 없습니다.</p>
