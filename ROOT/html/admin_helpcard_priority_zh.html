<body>
<p>请求的优先级用于定义请求的重要度。点击<strong>优先级列表</strong>旁的<strong>新建优先级</strong>链接可以创建新的优先级。<br>
  <br>
  <span class="helpheading">新建优先级</span><br>
  添加优先级需要定义两个内容：优先级名，描述。<br>
  <br>
<strong>名称：</strong>指定一个独特的名称以识别每个优先级。<br>
<strong>颜色：</strong>使用调色板选择一种颜色来表示优先级，或在文本框中指定颜色代码。<br>
<strong>描述：</strong>在<strong>描述</strong>字段中输入一个对优先级的简单描述。有助于理解该优先级的具体意义和内容。</p>
<p>点击<strong>保存</strong>按钮以保存优先级并返回至视图列表。<br>
  点击<strong>保存并新添</strong>按钮以保存优先级并添加其他优先级。
</p>
</body>
</html>
