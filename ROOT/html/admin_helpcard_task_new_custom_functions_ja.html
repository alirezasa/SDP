<title>task_new_custom_functions</title>
</head>

<body>
	<p>この画面では、カスタムアクションの関数名、説明、API名を入力してください。</p>
	<p>カスタムアクションを構築するには、<strong>Delugeスクリプトエディター</strong>と呼ばれる、シンプルなドラッグ&ドロップのインターフェースを使用します。<strong>taskObj</strong>と<strong>context</strong>が関数の引数として渡されます。また、関数は<strong>Map</strong>型の値を返す必要があります。詳しくは<a href="http://servicedeskplus.helpdocsonline.com/task-custom-function" target="_blank">こちら</a>をご覧ください。</p>
	<p><strong>［保存してテスト］</strong>をクリックすることで、タスクへのカスタムアクションのテスト実行を行います。関数の出力は、デバッグに用いられる<strong>情報</strong>ステートメントとともに表示されます。また、カスタムアクションをテストせず、単に保存することも可能です。</p>
</body>

</html>
