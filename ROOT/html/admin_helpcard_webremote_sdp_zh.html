<div class="helpcard mb15" >
	<div class="header">
		<span class="title help-icon"><span class="fl mt3">帮助卡</span></span>
		
	</div>
	<div id="helpcardContent" class="content">
		<div>
			<p class="mt0">
				Web Remote是一个内置工具可用于与客户端机器（Windows平台）建立远程会话。该工具可从应用发起，无需在客户端安装插件。它也支持会话记录以及回放。Web Remote在一个独立的端口（8083）上提供服务。默认端口可修改。
			</p>
			<div class="alert alert-warning">
				了解更多有关Web remote功能，<a href="https://www.manageengine.com/products/service-desk/help/adminguide/configurations/discovery/web-remote.html" target="_blank" rel="noopener noreferrer" class="text-link">点击这里</a>
			</div>
			<p><strong>使用Web Remote</strong></p>
			<ul class="pl20 bullet-arrow">
			   	<li>工作站/服务器的名称将会自动填充</li>
			   	<li>输入服务器端口号</li>
			  	<li>如果您想要记录远程会话，点击“启用会话记录”复选框</li>
			   	<li>启用Web Remote，“启用会话记录”</li>
			   	<li>输入Web Remote端口号，默认端口号为3389</li>
			   	<li>点击<strong>提交</strong></li>
			</ul>
		</div>
	</div>
</div>
