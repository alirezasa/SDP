<body>
    <p>リリースのクロージャーコードを用いることで、リリースをクローズする際の理由を明記することができます。</p>
    <ul>
      <li>クロージャーコードを追加するには、<strong>［新規］</strong>ボタンをクリックします。</li>
      <li>クロージャーコードの編集や削除をするには、クロージャーコード横の<strong>ハンバーガーアイコン</strong>をクリックしメニューから選択します。</li>
    </ul>
    <p><strong>注意：</strong></p>
    <p>リリースで使用されているクロージャーコードが削除された場合は、それらは非アクティブ化されます。非アクティブ化されたクロージャーコードは一覧ページよりアクティブ化に戻すことができます。</p>
    </body>

</html>
