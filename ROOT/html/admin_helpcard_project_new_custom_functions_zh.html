	<p>在此页面，为您的自定义函数提供名称、描述和API名称。</p>
	<p>使用名为<strong>Deluge 脚本构建器</strong>的简单的拖放式界面来建立您的自定义动作。<strong>projectObj</strong>和<strong>context</strong>将作为参数传递给函数，此函数应当返回<strong>Map</strong>类型数据。更多信息，请<a href="https://help.servicedeskplus.com/project-custom-function" target="_blank">访问此页</a>。</p>
	<p>点击<strong>保存并测试</strong>在项目上运行自定义动作。输出将会以<strong>info</strong>语句的形式用于调试输出，您也可以简单保存此自定义动作。</p>
