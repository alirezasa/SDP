<p>大多数的变更在实施时都可能会出现一定的风险。为了完成该变更，变更的相关人员（用户）必须知晓这些风险。 </p>

<p>默认情况下，本软件提供的风险有3个级别。配置的风险将指定到新的变更请求。 </p>

<span class=helpheading>要添加风险</span> &nbsp; 

<p style="margin-top: 5pt; margin-bottom: 5pt;">1. 点击<strong>添加风险</strong>按钮；</p>

<p style="margin-top: 5pt; margin-bottom: 5pt;">2. 指定风险级别的<strong>名称</strong>，如：高、中、低等；</p>

<p style="margin-top: 5pt; margin-bottom: 5pt;">3. 为该级别的风险输入简要<strong>描述</strong>，以便让相关人员知晓。</p>

<p style="margin-top: 5pt; margin-bottom: 5pt;">4. 点击<strong>保存</strong>按钮，添加的风险将显示在风险列表中。 <!--kadov_tag{{<spaces>}}-->
&nbsp;<!--kadov_tag{{</spaces>}}--></p>
