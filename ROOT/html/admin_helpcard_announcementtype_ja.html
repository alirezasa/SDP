<html>

<head>
    <meta http-equiv="content-type" content="text/html" charset="UTF-8">
    <title>アナウンスの種類</title>
</head>

<body>
<p>
    アナウンスの種類はアナウンスにおける追加情報を提供する際に使用します。ここで設定されたアナウンスの種類は、アナウンスの新規作成ページの編集フォームで利用できます。
</p>
<br>
<p><span class="helpheading">アナウンスの種類の追加</span><br><strong>［新規］</strong>をクリックし、<strong>「名称」</strong>と<strong>「説明」</strong>欄を入力して<strong>［保存］</strong>をクリックします。</p>
<br> <br>
<p> <span class="helpheading">アナウンスの種類の編集</span><br>編集したいアナウンスの種類の名称をクリックし、変更後、<strong>［更新］</strong>をクリックします。</p>
<br><br>
<p> <span class="helpheading">アナウンスの種類の削除</span><br>削除したいアナウンスの種類のチェックボックスにチェックを入れ、削除アイコンをクリックします。</p>

</body>

</html>
