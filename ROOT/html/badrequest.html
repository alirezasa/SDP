<html>

<head>
    <title>Manage Engine</title>
    <style type="text/css">
        * {
            margin: 0;
            padding: 0;
            font-family: 'Roboto', arial;
            box-sizing: content-box;
        }

        html, body {
            line-height: 1.2;
        }

        .table-wrap {
            display: table;
            width: 100%;
            height: 100%;
        }

        .table-cell-wrap {
            display: table-cell;
            vertical-align: middle;
        }

        .error-content {
            width: 680px;
            background-color: #FFF;
            display: table;
            margin: 0 auto;
            border: 1px solid #B9B9B9;
            box-shadow: 0px 0px 15px 0px #8E8E8E;
        }

        .tc {
            text-align: center !important;
        }

        .mt30 {
            margin-top: 30px !important;
        }

        .error-message {
            font-size: 30px;
            color: #E13B0E;
            padding: 36px 30px 13px 30px;
        }

        .error-message,
        .error-inputmessage {
            font-weight: bold;
            text-align: center;
        }

        .info-big {
            background-position: -186px -95px;
            width: 40px;
            height: 40px;
        }

        .cspr {
            background-image: url(/images/ui-common-view.svg);
            background-repeat: no-repeat;
            display: inline-block;
            vertical-align: sub;
        }

        .mb30 {
            margin-bottom: 30px !important;
        }

        .mt10 {
            margin-top: 10px !important;
        }

        .pt20 {
            padding-top: 20px !important;
        }

        .mt0 {
            margin-top: 0px !important;
        }

        .error-privilegemessage {
            font-size: 14px;
            color: #626262;
            padding: 0px 30px 46px 30px;
            text-align: center;
        }

        .error-bottomreturn {
            height: 77px;
            background-color: #EFEFEF;
            border-top: 1px solid #BABABA;
            position: relative;
            display: table;
            width: 100%;
        }

        .error-returnback {
            float: left;
            padding: 29px 0px 0px 40px;
        }

        .error-returnback,
        .error-returnhome {
            font-size: 14px;
            font-weight: bold;
            color: #636363;
        }

        .error-returnhome {
            float: right;
            padding: 29px 25px 0px 0px;
        }

        .mt50 {
            margin-top: 50px !important;
        }

        .error-returnback em {
            background-position: -119px -36px;
            width: 12px;
            height: 19px;
            margin-bottom: -5px;
        }

        .error-returnback em,
        .error-returnhome em {
            direction: rtl;
            margin-left: 6px;
        }

        .error-returnback em,
        .error-returnhome em {
            background-image: url(/images/error-sprite.png);
            background-repeat: no-repeat;
            display: inline-block;
            margin-right: 6px;
        }

        .error-returnhome em {
            background-position: -114px -1px;
            width: 22px;
            height: 20px;
            margin-bottom: -4px;
        }

        a,
        a:active,
        a:hover,
        a:focus {
            outline: none;
            text-decoration: none !important;
        }
        a, a:hover, a:focus, .text-link, .text-link:hover, .text-link:focus, a.text-link, a.text-link:hover, a.text-link:focus, .btn-link, .btn-link:hover, .btn-link:focus, .text-primary, a.text-primary:hover{
            color: #008ddd;
        }

        p {
            margin: 0 0 9px;
        }
    </style>
</head>

<body>
    <div class="table-wrap">
        <div class="table-cell-wrap">
            <div class="error-content">
                <div class="tc mt50">
                    <span aria-hidden="true" class="cspr info-big mb30 mt10" style="transform: scale(2);"></span>
                </div>
                <p class="error-message mt0 pt20" id="messageHolder">The request sent by the client was invalid or malformed.</p>
                <p class="error-privilegemessage"></p>
                <div class="error-bottomreturn">
                    <a href="/HomePage.do" class="error-returnback" id="go_back_link">
                        <em></em>
                        Go back and try again
                    </a>
                    <a href="/HomePage.do" class="error-returnhome">
                        <em></em>Return to home page
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
