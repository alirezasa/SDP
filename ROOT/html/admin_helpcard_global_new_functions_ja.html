<html>
	<head>
		<meta http-equiv="content-type" content="text/html" charset="UTF-8">

	<body>
		<ul>
			<li>グローバル関数の関数名を入力します。</li>
			<li>説明に、グローバル関数の使い方や目的を記載します。</li>
			<li>グローバル関数を他のカスタム関数からコールするための一意のAPI名を入力します。</li>
			<li>関数を構築するには<strong>Delugeスクリプトエディター</strong>と呼ばれる、シンプルなドラッグ&ドロップのインターフェースを使用します。戻り値の型の選択が可能で、パラメーターを10個まで入力することができます。</li>
			<li><strong>［保存］</strong>または、<strong>［保存してテスト］</strong>をクリックし、グローバル関数をテスト実行します。結果は、デバッグに用いられる<strong>情報</strong>ステートメントとともに表示されます。</li>
		</ul>
	</body>
</html>
