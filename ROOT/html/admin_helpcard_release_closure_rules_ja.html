<body>
    <p>リリースのクローズルールでは、ユーザーが現在のステージですべてのタスクを完了しなかった場合や、特定のフィールドを埋めなかった場合などに、リリースのライフサイクル上の次のステージに移動しないようにできます。クローズルールはすべてのリリースに共通のものになります。</p>
    <p>リリースの各ステージでフィールドや「未完了関連タスク」を必須化したい場合は、そのチェックボックスにチェックを入れ、<strong>［保存］</strong>をクリックします。</p>
