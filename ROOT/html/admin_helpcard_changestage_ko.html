<p style="text-align: justify;">변경 요청은 성공적으로 완료되고 계획대로 종료되기 전에 변경 수명 주기의 여러 스테이지를 거칩니다.<!--kadov_tag{{<spaces>}}-->&nbsp;<!--kadov_tag{{</spaces>}}-->변경 수명 주기에서 각 스테이지는 다음 스테이지로의 변경을 처리하기 전에 승인이 필요합니다. </p>

<p style="text-align: justify;">애플리케이션은 6개의 기본 <span style="font-weight: bold;">변경 단계</span>를 제공합니다. <span style="font-weight: bold;">제출</span>, <span style="font-weight: bold;">계획</span>, <span style="font-weight: bold;">승인</span>, <span style=" font-weight: bold;">구현</span>, <span style="font-weight: bold;">검토</span> 그리고 <span style="font-weight: bold;">종료</span> 입니다. 변경 단계에 대한 기존 <span style="font-weight: bold;">스테이지 명</span> 및 <span style="font-weight: bold;">설명</span>을 편집할 수 있습니다. 그러나 새 변경 스테이지를 추가하거나 기본 변경 스테이지를 삭제할 수는 없습니다. <!--kadov_tag{{<spaces>}}-->&nbsp;<!--kadov_tag{{</spaces>}}--></p>
