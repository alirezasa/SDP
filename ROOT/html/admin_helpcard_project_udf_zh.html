<body>
  <p><b>为项目表单配置附加字段</b></p>
  <ul>
    <li>您可以添加单行、精选列表、多行、数值、日期/时间、小数类型的字段。</li>
    <li>单行、精选列表、多行可以用于录入文本信息，同样的，针对数值、日期/时间、小数等，可用其它字段对应添加。</li>
    <li>在单行下录入数值信息，可选<strong>只允许数值</strong>选项。</li>
    <li>在每个字段配置页面，您需要在左侧输入字段信息，在右侧会显示预览画面。 </li>
    <li>所有配置的附加字段，将会自动添加到项目模板，您无需手动配置。</li>
  </ul>
</body>
</html>
