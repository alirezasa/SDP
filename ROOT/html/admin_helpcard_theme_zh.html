<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>主题设置</title>
</head>

<body>
<p class="helpheading"><strong>主题</strong></p>

<p><strong>更改颜色</strong></p>

<p>对于预设的颜色：选择一个预设的颜色组合。
	对于自定义颜色：点击自定义颜色来更改颜色，然后点击针对UI元素的颜色选择框，使用色域选择一个首选的颜色。</p>

<p><strong>更改字体</strong></p>

<p>从字体的下拉列表中选择您喜欢的字体。</p>

<p><strong>预览更改</strong></p>

<p>您可以通过右侧的互动预览以预览您的更改。</p>

<p><strong>用户个性化</strong></p>

<p>SDAdmin可以通过启用/禁用允许其他用户个性化定义主题和字体此选项，使用户自定义应用程序的颜色和字体，默认为启用。</p>

<strong>注：</strong>
<ul>
	<li>在主题设置中所作的更改将应用于所有技术员和请求者。</li>
	<li>当允许其他用户个性化定义主题和字体的复选框被选中时，用户的个性化将优先于管理员的颜色和字体配置。</li>
</ul>
</body>
</html>
