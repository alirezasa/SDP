<title>業務時間</title><p style="margin-top: 0.5pt; margin-bottom: 0.5pt;">組織の業務時間をサイト毎に設定できます。ここで設定した業務時間はSLAに基づく回答期日の計算時に使用します。</p>

<ol style="list-style: decimal;"
	type=1>
	
  <li class=kadov-p>業務時間を設定するサイトを選択。</li>
</ol>

<p style="margin-top: 0px;
			margin-bottom: 0px;
			margin-left: 40px;"><span style="font-weight: bold; x-text-underline: normal; /*begin!kadov{{*/ text-decoration: underline; /*}}end!kadov*/ ">メモ</span><span 
 style="margin-bottom: 6px;">：サイトアドミンの場合は、関連づけられているサイトのみ表示されます。サイトが設定されていない場合は、サイトを選択するコンボボックスは表示されません。</span></p>

<ol start=2
	style="list-style: decimal;"
	type=1>
	
  <li class=kadov-p>組織のヘルプデスクが24時間稼働している場合、<strong>24時間業務</strong>のラジオボタンを選択。</li>
	
  <li class=kadov-p>業務時間を指定する場合は、<strong>開始時間</strong>と<strong>終了時間</strong>を選択。</li>
	<li class=kadov-p>ヘルプデスクが稼働する<strong>曜日</strong>を選択。</li>
	<li class=kadov-p><strong>保存</strong>をクリックして設定を保存。</li>
</ol>
