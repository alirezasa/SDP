<body>
<p>项目状态用于表述项目的进展情况，并根据不同的项目状态，采取相应的动作。默认的项目状态有：开放(未处理), 搁置(停顿), 
已取消和已关闭。您可以按照以下步骤创建新的项目状态。</p>
<p>
  
  <span class="helpheading">添加项目状态</span><br>
	在添加项目状态的画面中，有3个字段，它们是：名称、描述以及休眠复选框。</p>
<p>
  <b>名称: </b>项目状态的识别符，请指定唯一的名称，不能重复。<br>
  
  <strong>描述:</strong> 输入该状态的简要描述。
</p>
  
<p>
  
  <b>休眠复选框: </b> 选中它，则<strong>该状态休眠</strong>，不选则该状态重新激活。</p>
<p><strong>颜色:</strong>用于表示该状态的颜色。可从颜色画板中选择颜色或者直接指定颜色代码。</p>


<p>  点击<b>保存</b>按钮，保存该项目状态，并返回状态列表视图。<br>
  点击<b>保存并新建</b>按钮，可保存该状态并创建新的状态。
</p>
</body>
</html>
