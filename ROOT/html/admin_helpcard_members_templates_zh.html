<div>
    <p>在这个页面，您可以添加成员到项目，并指派其角色。</p>
    <span class="helpheading">添加模板成员</span><br>
    <p>添加成员到一个项目模板：</p>
    <ol>
        <li>点击<strong>添加</strong>，从可用的用户列表页面选择用户。</li>
        <li>通过<strong>选择项目角色</strong>下拉菜单为选择的用户指派项目角色，并点击<strong>添加</strong>。</li>
        <p>提示：如果用户拥有默认项目角色，则不必为其分配项目角色。但是，您可以分配新角色。</p>    
        <li>选择的用户将会列在项目<strong>成员</strong>标签下。</li>
    </ol>
    <p>如果一个项目是通过这个模板创建的，那么位于项目模板成员标签下的所有成员将会被自动指派到项目。</p>
</div>
