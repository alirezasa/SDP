    <br>
    <strong>SDP-JIRA集成</strong>:

    <p align="justify">ServiceDesk Plus (SDP) - JIRA集成帮助技术人员在JIRA中创建具有首选问题类型的任何SDP请求。</p>
<br>
    <strong>在SDP中配置JIRA设置:</strong>
    <ul>
        <li>输入JIRA应用程序当前运行的服务器名称和服务器端口，并在http和https协议设置之间进行选择。</li>
        <li>输入JIRA管理员凭证(用户名/密码)并保存配置。密码将被加密并安全地保存在数据库中。</li>
        <li>点击<strong>保存</strong>保存设置。</li>
    </ul>

    有关JIRA集成的详细信息，请单击<a href="https://help.servicedeskplus.com/jira-integration">这里</a>。<br>
</body>
