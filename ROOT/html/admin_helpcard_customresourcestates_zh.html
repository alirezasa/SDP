	<p class="helpheading">资源状态</p>

<p>可以根据资源在组织内的状态对资源进行分类，这些状态可能是：在用、在库、在修、过期、配置等。系统默认的状态不可编辑或删除。</p>

 <p class="helpheading" style="font-weight: bold;">要添加新的资源状态,</p>

<ol>
	
	<li class=kadov-p><p style="margin-top: 0px; margin-bottom: 0px;">点击右上角的<span style="font-weight: bold;">新建资源状态</span>，打开<span style="font-weight: bold;">资源状态明细</span>画面。</p></li>
	
	<li class=kadov-p><p style="margin-top: 0px; margin-bottom: 0px;">指定<span style="font-weight: bold;">资源状态</span>名称，这是必选项。</p></li>
	
	<li class=kadov-p><p style="margin-top: 0px; margin-bottom: 0px;">在<span style="font-weight: bold;">描述</span>字段中输入该状态的简要描述。</p></li>
	
	<li class=kadov-p><p style="margin-top: 0px; margin-bottom: 0px;">点击<span style="font-weight: bold;">添加资源状态</span>按钮，保存设置。</p></li>
</ol>
