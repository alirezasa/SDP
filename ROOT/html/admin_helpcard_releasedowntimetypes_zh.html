<p>添加服务部署期间可能发生的不同类型的停机。</p>
<ul>
  <li>使用<strong>“新建”</strong>按钮以添加停机类型。</li>
  <li>使用<strong>“动作列表”</strong>图标，以编辑或删除停机类型。您还可以点击停机类型来编辑它。</li>
</ul>
<p><strong>注</strong>:</p>
<p>最多支持50种停机类型，包括默认停机类型和非活动停机类型。</p>
<p>如果在发布中使用的停机时间被删除，则将被禁用。编辑非活动停机时间以恢复。 </p>
