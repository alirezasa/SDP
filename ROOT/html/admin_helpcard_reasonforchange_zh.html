<p style="margin-top: 5pt;
			margin-bottom: 5pt;
			text-align: justify;"><span style="font-weight: bold;">变更理由</span>表示为什么要发起一个变更请求。例如：您的网络打印机由于硒鼓损坏不工作了，则<strong>变更理由</strong>就可以是<strong>打印机不工作</strong>，而发起的变更请求可能是<strong>更换打印机硒鼓</strong>。 </p>

<p style="margin-top: 5pt;
			margin-bottom: 5pt;
			text-align: justify;">
类似地，您可以提前列举出发起变更的常见理由，这样，既可以便于发起变更请求，也可以在常见变更之后获取变更理由的报表，以便更好地管理变更。 
 </p>

<p style="font-weight: bold;">添加<span class=helpheading>变更理由</span> </p>

<ol style="list-style: decimal;"
	type=1>
	
	<li class=kadov-p><p style="margin-top: 5pt; margin-bottom: 5pt;">
	点击添加变更理由按钮。</p></li>
	
	<li class=kadov-p><p style="margin-top: 5pt; margin-bottom: 5pt;">输入变更理由的名称。</p></li>
	
	<li class=kadov-p><p style="margin-top: 5pt; margin-bottom: 5pt;">
	提供变更理由的简要描述。 </p></li>
	
	<li class=kadov-p><p style="margin-top: 5pt; margin-bottom: 5pt;">点击保存按钮。 </p></li>
</ol>
