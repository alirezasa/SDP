<p><b>Amenities</b></p>

<p>Define the various amenities that are available in the spaces. You can add relevant icons to the amenities which will be shown in the space details page.</p>

<p>Click <strong>New Amenity</strong> and fill out the required details on the displayed page, and click <strong>Save</strong>.</p>
