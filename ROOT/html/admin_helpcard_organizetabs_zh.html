<!doctype html>

<title>组织标签设置</title>
</head>

<body>

<p class="helpheading"><strong>组织标签</strong></p>

<p>组织标签可以重新组织标题栏的标签。</p>

<p><strong>用户个性化</strong></p>

<p>SDAdmin可以使用 "允许技术员个性化标签 "复选框，以启用/禁用用户自定义模块的标签。此选项在默认情况下是禁用的。</p>

<strong>注：</strong>
<ul>
	<li>当 "允许技术员个性化标签 "被选中时，"用户个性化"将优先于管理员的配置。</li>
	<li>SDAdmin只能重新排列模块标签，其他用户可以启用、禁用和重新排列模块标签。</li>
	<li>"重置"按钮在重新排序时可用，在管理页面中重置为默认顺序，在组织标签面板中重置为管理设置顺序。</li>
	<li>在组织标签设置中所作的更改将应用于所有技术员。</li>
</ul>

</body>
</html>
