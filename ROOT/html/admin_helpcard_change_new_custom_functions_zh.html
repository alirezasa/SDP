		<p>在显示页面上，提供自定义动作的名称和描述。</p>
		<p>使用名为<strong>Deluge Script Editor</strong>的简单拖放界面来构建自定义动作。<strong>changeObj</strong>和<strong>context</strong>将作为参数传递给函数。该函数应返回<strong>Map</strong>类型的数据。 更多详细信息，<a href="https://help.servicedeskplus.com/change-custom-function" class="text-link" target="_blank">请访问此页面</a>。</p>
		<p>单击<strong>保存并测试</strong>以测试对更改运行自定义操作。输出将与用于调试的<strong>info</strong> 语句一起打印。您也可以简单地保存自定义动作。</p>
