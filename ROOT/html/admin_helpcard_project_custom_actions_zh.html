<body>
	<p>自定义动作是可操作的自定义函数（建立在Zoho专用脚本语言Deluge上），允许用户在ServiceDesk Plus和其它外部应用程序中操作数据。</p>
	<p>自定义动作可以在项目自定义触发器中使用，对项目、其他模块和外部应用程序执行操作。</p>
	<ul>
		<li>使用 "新建 "按钮来创建一个自定义动作。</li>
		<li>使用动作按钮允许您进行批量删除、禁用和启用自定义动作。</li>
		<li>要修改个别的自定义动作，请使用自定义动作旁边的图标。</li>
		<li>在提供的字段中使用关键词搜索自定义动作。使用顶部的过滤器展示用于特定功能的自定义动作。</li>
	</ul>
	<p>注：只有激活的自定义动作才可以在项目自定义触发器中使用。</p>
</body>
</html>
