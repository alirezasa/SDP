<p>通过设置代理服务器来确保组织与其他服务器之间的安全连接或交互。</p>

<p>在配置代理服务器设置时提供以下详细信息：</p>

<p><strong>主机：</strong>指定代理服务器的名称（例如：servicedesk-1212）</p>

<p><strong>端口：</strong>指定代理服务器的端口号（例如：8080）</p>

<p><strong>用户名：</strong>指定代理设置的用户名（例如：servicedesk）</p>

<p><strong>密码：</strong>指定代理设置的密码</p>

<p>如果错误输入了代理配置，则会影响以下功能：</p>

<ul>
	<li>邮件服务器设置（传入/传出）</li>
	<li>Analytics Plus / Zoho Reports集成</li>
	<li>系统升级</li>
	<li>短信通知设置</li>
	<li>其他集成</li>
</ul>
</body>
