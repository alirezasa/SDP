<p style="margin-bottom: 5pt; margin-top: 0pt;">
服务目录是指IT部门可以为终端用户提供的各种服务的列表。如：平时经常被用户要求的软件安装、互联网接入、邮件接入等等。可以将这些服务分组，分别列于服务目录之下，供用户选择。 </p>

<p style="margin-bottom: 5pt; margin-top: 0pt;">服务目录代表不同类型的一组服务项目，可以点击 
 <span style="font-weight: bold;">添加服务类别</span>按钮，来添加新的类别，也可通过管理下拉框，来配置服务目录用的<span style="font-weight: bold;">附加字段</span>和对应请求的<span style="font-weight: bold;">服务级别协议</span>。</p>

<p style="margin-bottom: 5pt; margin-top: 0pt;">可通过<span 
 style="font-weight: bold;">添加服务</span>按钮来为一种服务类别添加相应的<span style="font-weight: bold;">服务请求</span>。点击服务类别名，可查看相应类别下的服务列表，鼠标指向服务项目，可显示<span 
 style="font-weight: bold;">删除</span>, <span style="font-weight: bold;">编辑</span> 
和 <span style="font-weight: bold;">禁用</span> 图标。</p>

<p style="margin-bottom: 5pt; margin-top: 0pt;">
通过服务目录页面，可以很方便地访问服务。使用户更加方便地提交服务请求并监视其状态。</p>
