<body>
<p>使用发布附加字段捕捉任何有关发布的额外信息。</p>
<p>要创建一个新的附加字段，</p>
<ul>
  <li>使用<strong>新建</strong>按钮以创建一个附加字段。</li>
  <li>在指定字段类型后，提供一个字段名和描述。字段属性根据所选字段类型而变化。</li>
  <li>您可以对单行和多行字段类型进行加密，以增加安全性。请注意：您只能在创建一个字段时对其进行加密，以后不能禁用字段加密。</li>
  <li>基于选定的字段类型，指定其他字段属性。</li>
  <li>点击<strong>保存</strong>。</li>
</ul>
<p>要编辑或删除一个附加字段，请点击字段名旁边的相关图标。注意：如果附加字段已删除，其将从自动配置的发布模板中被删除。</p>
<a href="https://help.servicedeskplus.com/release-additional-fields" target="_blank">点击这里了解更多关于附加字段的信息。</a>
</body>
</html>
