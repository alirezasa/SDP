<p><span class="helpheading"><strong>里程碑模板</strong></span></p>
<p>里程碑是一个项目内所要达到的目标点。通常在大型项目中都会存在，实际上它本身就像一个项目。</p>
<p><strong>标题:</strong> 该里程碑的标题。</p>
<p><strong>描述:</strong> 该里程碑的简要描述，说明该里程碑的意义。</p>
<p><strong>优先级:</strong> 表示该里程碑的优先级，可从已有的优先级中选择。</p>
<p><strong>状态:</strong> 表示该里程碑的状态，可从已有状态中选择。</p>
<p><strong>估计小时数:</strong> 提供完成该里程碑所需的估计时间。</p>
<p><strong>保存:</strong> 下拉菜单，可允许您通过它添加里程碑任务或者新建里程碑。</p>
</div>
