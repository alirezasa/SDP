<p><b>园区模板</b></p>

<p>为校园、学校、学院等创建并保存模板，以便在用户创建类似模板时提供帮助。</p>

<p>在此页面，您可以创建一个新的园区模板，编辑或删除现有的模板。</p>

<p>要创建一个新的园区模板，请点击新建园区模板。</p>

<p>新的园区模板表格有两个部分，</p>

<p>1. 信息:在这里，您可以定义园区模板，比如为它添加一个显示名称、名称和描述。</p>

<p>2. 字段: 一旦您保存了信息部分，可以从右侧的新字段部分拖动所需的字段，向园区模板添加新字段。</p>

<p>要命名一个分段，请点击无标题文本，并键入所需的分段名称。</p>

<p>最后，保存字段配置。</p>
