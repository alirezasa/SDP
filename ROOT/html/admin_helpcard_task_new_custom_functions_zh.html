	<p>在显示的页面上，为您的自定义动作提供一个名称、描述和API名称。</p>
	<p>使用名为<strong>Deluge脚本编辑器</strong>的简单拖放界面来建立你的自定义动作。<strong>taskObj</strong>和<strong>上下文</strong>将被作为参数传递给函数。该函数应返回<strong>映射</strong>类型的数据。了解更多信息<a href="https://help.servicedeskplus.com/task-custom-function" target="_blank">请访问此页</a>。</p>
	<p>点击<strong>保存并测试</strong>来测试运行任务上的自定义动作。输出将随着用于调试的<strong>info</strong>语句一起打印。您还可以进行简单地保存自定义操作。</p>
