<p><b>房间模板</b></p>

<p>为经常创建的房间（如私人办公室、储藏室、茶水间等）创建并保存模板，以便在用户创建类似房间时提供帮助。</p>

<p>在此页面，您可以创建一个新的房间模板，编辑或删除现有的模板。</p>

<p>要创建一个新的房间模板，请点击 <b>新建房间模板</b>。</p>

<p>新的房间模板有两个部分，</p>

<p>1. <b>详细信息</b>:在这里，您可以通过为其添加显示名称、名称和描述来定义房间模板。</p>

<p>2. <b>字段</b>:一旦保存了信息部分，您可以从右侧的<b>新字段</b>拖动所需字段，向房间模板添加新字段。</p>

<p>要命名一个分段，请点击<b>未命名</b>文本，并键入所需的分段名称。</p>

<p>最后，保存字段配置。</p>
